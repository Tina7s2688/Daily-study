<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>每日學習燈</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="wrap top-inner">
      <a class="brand" href="#today"><span class="lamp" aria-hidden="true"></span>每日學習燈</a>
      <div class="chips">
        <span class="chip" id="chip-exam">距離多益 — 天</span>
        <span class="chip chip-streak" id="chip-streak">連續 0 天</span>
        <button class="chip chip-btn" id="auth-btn" type="button" hidden>登入</button>
      </div>
    </div>
    <nav class="wrap tabs" aria-label="主選單">
      <a href="#today" data-tab="today">今天</a>
      <a href="#listening" data-tab="listening">多益聽力</a>
      <a href="#sql" data-tab="sql">SQL</a>
      <a href="#progress" data-tab="progress">進度</a>
    </nav>
    <div class="wrap" id="auth-panel" hidden></div>
  </header>

  <main class="wrap">
    <section id="view-today" class="view"></section>
    <section id="view-listening" class="view" hidden></section>
    <section id="view-sql" class="view" hidden></section>
    <section id="view-progress" class="view" hidden></section>
  </main>

  <footer class="wrap foot">
    <span id="storage-note">進度存在這台裝置的瀏覽器裡。</span>
  </footer>

  <script src="data/listening.js"></script>
  <script src="data/sql-levels.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="db.js"></script>
</body>
</html>
